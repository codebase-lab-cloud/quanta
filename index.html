<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portfolio — Sign in</title>
<meta name="color-scheme" content="dark" />
<style>
  :root{
    --bg:#070b15;--card:#0f1a33;--border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.15);
    --text:#eef2ff;--muted:#8ea0c8;--muted2:#6b7aa5;--accent:#3b82f6;--accent2:#5b8def;
    --red:#ef4444;--green:#22c55e;--radius:20px;--shadow:0 20px 60px rgba(0,0,0,0.55);
    --sans:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
    --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:radial-gradient(900px 600px at 50% -10%, rgba(59,130,246,0.18), transparent 70%), var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .page{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
  .shell{width:100%;max-width:420px}
  .brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:18px;text-align:center}
  .logo{width:46px;height:46px;border-radius:14px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:14px}
  .brand h1{margin:0;font-size:17px;font-weight:850;letter-spacing:-0.02em}
  .brand p{margin:0;color:var(--muted);font-size:12px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .card-head{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .card-head h2{margin:0;font-size:13px;font-weight:800;letter-spacing:-0.02em}
  .step-dots{display:flex;gap:6px}
  .step-dots i{width:20px;height:4px;border-radius:999px;background:rgba(255,255,255,0.12);display:block}
  .step-dots i.on{background:var(--accent)}
  .card-body{padding:20px 22px 18px}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .label{font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,0.28);color:var(--text);font-size:14px;outline:none;transition:border .15s, box-shadow .15s}
  .input:focus{border-color:rgba(59,130,246,0.55);box-shadow:0 0 0 4px rgba(59,130,246,0.14)}
  .input.mono{font-family:var(--mono)}
  .row{display:flex;gap:10px}
  .row .field{flex:1}
  .hint{font-size:11.5px;color:var(--muted);line-height:1.4}
  .hint a{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
  .btn{appearance:none;border:1px solid var(--border);background:rgba(255,255,255,0.06);color:var(--text);padding:11px 14px;border-radius:999px;font-size:13px;font-weight:750;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;width:100%}
  .btn:hover{background:rgba(255,255,255,0.10);border-color:var(--border2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 10px 22px rgba(59,130,246,0.32)}
  .btn.primary:hover{background:#2563eb}
  .btn.ghost{background:transparent}
  .btn.small{padding:8px 12px;font-size:12px;width:auto}
  .error,.success{padding:10px 12px;border-radius:12px;font-size:12.5px;display:none;line-height:1.45}
  .error{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.25);color:#fecaca}
  .success{background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.25);color:#86efac}
  .error.show,.success.show{display:block}
  .sub-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
  .link{font-size:11.5px;color:var(--muted);background:none;border:none;cursor:pointer;padding:0}
  .link:hover{color:var(--text);text-decoration:underline}
  .sep{display:flex;align-items:center;gap:10px;margin:12px 0;color:var(--muted2);font-size:11px}
  .sep::before,.sep::after{content:"";height:1px;flex:1;background:var(--border)}
  .mono{font-family:var(--mono)}
  .foot{margin-top:14px;text-align:center;color:var(--muted2);font-size:11px}
  #app-host{display:none}
  #app-host.show{display:block}
  .hidden{display:none !important}
  #toast-wrap{position:fixed;right:14px;bottom:14px;z-index:90;display:flex;flex-direction:column;gap:8px}
  .toast{padding:12px 14px;border-radius:12px;background:#0f172a;color:#fff;border:1px solid rgba(255,255,255,0.12);box-shadow:var(--shadow);font-size:13px;max-width:340px}
  details{margin-top:10px}
  details summary{font-size:11.5px;color:var(--muted);cursor:pointer;list-style:none}
  details summary::-webkit-details-marker{display:none}
  details summary span{border-bottom:1px dotted var(--muted)}
</style>
</head>
<body>
<div class="page">
  <div class="shell" id="lock-wrap">
    <div class="brand">
      <div class="logo">◈</div>
      <h1>Portfolio</h1>
      <p>Sign in to continue</p>
    </div>

    <div class="card" id="card-auth">
      <div class="card-head">
        <h2 id="auth-title">Device PIN</h2>
        <div class="step-dots" aria-hidden="true"><i id="dot1" class="on"></i><i id="dot2"></i></div>
      </div>
      <div class="card-body">
        <!-- PIN -->
        <div id="stage-pin">
          <div class="field">
            <label class="label" for="pin-input">PIN</label>
            <input id="pin-input" class="input mono" type="password" inputmode="numeric" autocomplete="off" placeholder="Enter PIN" maxlength="32" />
            <div class="hint">Local to this device only.</div>
          </div>
          <div class="field hidden" id="pin-confirm-field">
            <label class="label" for="pin-confirm">Confirm PIN</label>
            <input id="pin-confirm" class="input mono" type="password" autocomplete="off" placeholder="Confirm PIN" />
          </div>
          <div id="pin-error" class="error"></div>
          <div id="pin-success" class="success"></div>
          <button id="btn-pin" class="btn primary">Continue</button>
          <div class="sub-actions">
            <button id="btn-pin-reset" class="link" type="button">Reset PIN</button>
            <span class="hint mono" id="pin-state-label" style="font-size:11px"></span>
          </div>
          <div class="hidden"><div id="pin-setup-hint"></div><div id="pin-unlock-hint"></div><div id="pin-hint"></div><div id="prog" style="display:none"></div></div>
        </div>

        <!-- GitHub -->
        <div id="stage-github" class="hidden">
          <div class="row">
            <div class="field">
              <label class="label" for="gh-user">GitHub username</label>
              <input id="gh-user" class="input" type="text" autocomplete="off" placeholder="username" spellcheck="false" />
            </div>
            <div class="field">
              <label class="label" for="gh-repo">Private repo</label>
              <input id="gh-repo" class="input" type="text" autocomplete="off" placeholder="portfolio-private" spellcheck="false" />
            </div>
          </div>
          <div class="field">
            <label class="label" for="gh-token">Personal access token</label>
            <input id="gh-token" class="input mono" type="password" autocomplete="off" placeholder="github_pat_…" spellcheck="false" />
            <div class="hint">Fine-grained, scoped to this repo only · Contents: Read & write · 90-day expiry.</div>
          </div>
          <details>
            <summary><span>Advanced (branch / path)</span></summary>
            <div class="row" style="margin-top:10px">
              <div class="field"><label class="label" for="gh-branch">Branch</label><input id="gh-branch" class="input mono" type="text" value="main" spellcheck="false" /></div>
              <div class="field"><label class="label" for="gh-path">File</label><input id="gh-path" class="input mono" type="text" value="data.json" spellcheck="false" /></div>
            </div>
          </details>
          <div id="gh-error" class="error" style="margin-top:10px"></div>
          <div id="gh-success" class="success" style="margin-top:10px"></div>
          <button id="btn-gh" class="btn primary" style="margin-top:12px">Sign in</button>
          <div class="sep">or</div>
          <button id="btn-gh-demo" class="btn ghost" type="button">Use demo mode</button>
          <div class="sub-actions" style="justify-content:center">
            <button id="btn-back-pin" class="link" type="button">← Back</button>
          </div>
        </div>

        <!-- Loading -->
        <div id="stage-loading" class="hidden" style="text-align:center;padding:16px 0">
          <div style="font-size:22px;margin-bottom:8px">⟳</div>
          <div style="font-weight:750;font-size:13px">Signing in…</div>
          <div class="hint" style="margin-top:4px" id="loading-hint">Verifying with GitHub</div>
          <div style="height:3px;background:rgba(255,255,255,0.08);border-radius:999px;overflow:hidden;margin:12px auto 0;max-width:180px"><i id="prog-load" style="display:block;height:100%;width:70%;background:var(--accent);border-radius:999px"></i></div>
        </div>
      </div>
    </div>

    <div class="foot">No data is stored in the public site · Token stays in memory only</div>
  </div>
</div>

<div id="app-host"></div>
<div id="toast-wrap"></div>

<script>
(() => {
  "use strict";
  const SESSION = { username: null, repo: null, token: null, branch: "main", path: "data.json" };
  let inactivityTimer = null;
  const INACTIVITY_MS = 15 * 60 * 1000;
  const $ = (id) => document.getElementById(id);
  const errPin = $("pin-error"), okPin = $("pin-success"), errGh = $("gh-error"), okGh = $("gh-success");
  function show(el, msg){ el.textContent = msg; el.classList.add("show"); }
  function hide(el){ el.textContent=""; el.classList.remove("show"); }
  function toast(msg){
    const w=$("toast-wrap"); const d=document.createElement("div"); d.className="toast"; d.textContent=msg; w.appendChild(d);
    setTimeout(()=>{ d.style.opacity="0"; d.style.transform="translateY(4px)"; d.style.transition="all .25s"; setTimeout(()=>d.remove(),250)},2700);
  }
  async function hashPin(pin, salt){
    const enc = new TextEncoder();
    const data = enc.encode(pin + salt);
    const digest = await crypto.subtle.digest("SHA-256", data);
    return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  function getSalt(){ return localStorage.getItem("portfolioPinSalt"); }
  function getHash(){ return localStorage.getItem("portfolioPinHashV1"); }
  function hasPin(){ return !!getSalt() && !!getHash(); }
  function setProgress(pct){
    const prog=$("prog"); if(prog) prog.style.width=pct+"%";
    const d1=$("dot1"), d2=$("dot2");
    if(!d1||!d2) return;
    if(pct<50){ d1.classList.add("on"); d2.classList.remove("on"); }
    else { d1.classList.add("on"); d2.classList.add("on"); }
  }
  function refreshPinUI(){
    const has = hasPin();
    const title=$("auth-title");
    if(title) title.textContent = has ? "Enter PIN" : "Set a PIN";
    const btn=$("btn-pin");
    if(btn) btn.textContent = has ? "Continue" : "Set PIN & continue";
    const confirmField=$("pin-confirm-field");
    if(confirmField) confirmField.classList.toggle("hidden", has);
    const label=$("pin-state-label");
    if(label) label.textContent = "";
    setProgress(33);
  }
  async function handlePin(){
    hide(errPin); hide(okPin);
    const pin = $("pin-input").value;
    const confirm = $("pin-confirm").value;
    if (!pin || pin.length < 4) { show(errPin, "PIN must be at least 4 characters."); return; }
    if (!hasPin() && pin !== confirm) { show(errPin, "PINs do not match."); return; }
    if (!hasPin()){
      const saltArr = new Uint8Array(16); crypto.getRandomValues(saltArr);
      const salt = [...saltArr].map(b=>b.toString(16).padStart(2,"0")).join("");
      const h = await hashPin(pin, salt);
      localStorage.setItem("portfolioPinSalt", salt);
      localStorage.setItem("portfolioPinHashV1", h);
      $("pin-input").value=""; $("pin-confirm").value="";
      show(okPin, "PIN set.");
      setTimeout(()=> goGithub(), 350);
    } else {
      const salt = getSalt();
      const h = await hashPin(pin, salt);
      $("pin-input").value="";
      if (h !== getHash()) { show(errPin, "Incorrect PIN."); return; }
      show(okPin, "PIN verified.");
      setTimeout(()=> goGithub(), 300);
    }
  }
  function goGithub(){
    $("stage-pin").classList.add("hidden");
    $("stage-github").classList.remove("hidden");
    $("stage-loading").classList.add("hidden");
    const t=$("auth-title"); if(t) t.textContent="GitHub sign in";
    setProgress(66);
    $("gh-user").focus();
  }
  function goPin(){
    $("stage-pin").classList.remove("hidden");
    $("stage-github").classList.add("hidden");
    $("stage-loading").classList.add("hidden");
    refreshPinUI();
  }
  async function verifyAndLoad(){
    hide(errGh); hide(okGh);
    const username = $("gh-user").value.trim();
    const repo = $("gh-repo").value.trim();
    const token = $("gh-token").value;
    const branch = $("gh-branch").value.trim() || "main";
    const path = $("gh-path").value.trim() || "data.json";
    if (!username || !repo || !token) { show(errGh, "Username, repo and token are required."); return; }
    if (token === "demo"){
      SESSION.username = username || "demo"; SESSION.repo = repo || "demo"; SESSION.token = "demo"; SESSION.branch = branch; SESSION.path = path;
      show(okGh, "Demo mode — loading local data.");
      setTimeout(()=> loadApp(), 300);
      return;
    }
    SESSION.username = username; SESSION.repo = repo; SESSION.token = token; SESSION.branch = branch; SESSION.path = path;
    $("stage-github").classList.add("hidden");
    $("stage-loading").classList.remove("hidden");
    const t=$("auth-title"); if(t) t.textContent="Verifying…";
    setProgress(90);
    try {
      const url = `https://api.github.com/repos/${encodeURIComponent(username)}/${encodeURIComponent(repo)}/contents/${encodeURIComponent(path)}?ref=${encodeURIComponent(branch)}`;
      const res = await fetch(url, { headers: { "Authorization": `token ${token}`, "Accept": "application/vnd.github.v3+json" }, cache: "no-store" });
      if (!res.ok){
        throw new Error(res.status === 404 ? "Repo or file not found." : res.status === 401 ? "Invalid or expired token." : `GitHub error ${res.status}.`);
      }
      const j = await res.json();
      window.__GH_LAST_SHA__ = j.sha;
      show(okGh, "Verified.");
      setTimeout(()=> loadApp(), 300);
    } catch(e){
      SESSION.token = null;
      $("stage-loading").classList.add("hidden");
      $("stage-github").classList.remove("hidden");
      const t=$("auth-title"); if(t) t.textContent="GitHub sign in";
      setProgress(66);
      show(errGh, e.message || "Verification failed.");
      toast("Sign in failed");
    }
  }
  async function loadApp(){
    const isDemo = SESSION.token === "demo";
    const t=$("auth-title"); if(t) t.textContent="Loading…";
    try {
      if (!isDemo && SESSION.token){
        const base = `https://api.github.com/repos/${encodeURIComponent(SESSION.username)}/${encodeURIComponent(SESSION.repo)}/contents`;
        const headers = { "Authorization": `token ${SESSION.token}`, "Accept": "application/vnd.github.v3+json" };
        const fetchFile = async (name) => {
          const r = await fetch(`${base}/${encodeURIComponent(name)}?ref=${encodeURIComponent(SESSION.branch)}`, { headers, cache:"no-store" });
          if (!r.ok) throw new Error(`Missing ${name}`);
          const j = await r.json();
          const b64 = j.content.replace(/\n/g,"");
          const bin = atob(b64);
          const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
          return new TextDecoder().decode(bytes);
        };
        const [css, js] = await Promise.all([fetchFile("style.css"), fetchFile("app.js")]);
        injectApp(css, js);
      } else {
        let css = null, js = null;
        const tryFetch = async (paths) => {
          for (const p of paths){
            try{ const r=await fetch(p,{cache:"no-store"}); if(r.ok) return await r.text(); }catch{}
          }
          return null;
        };
        css = await tryFetch(["./private/style.css","/private/style.css","../private/style.css"]);
        js  = await tryFetch(["./private/app.js","/private/app.js","../private/app.js"]);
        if (!css || !js) throw new Error("Private files not found.");
        injectApp(css, js);
      }
    } catch(e){
      $("stage-loading").classList.add("hidden");
      $("stage-github").classList.remove("hidden");
      show(errGh, e.message || "Failed to load app. Use token 'demo' for preview.");
    }
  }
  function injectApp(css, js){
    window.__GH_SESSION__ = { ...SESSION };
    window.__GH_CONFIG__ = { username: SESSION.username, repo: SESSION.repo, branch: SESSION.branch };
    const style = document.createElement("style");
    style.id = "private-style";
    style.textContent = css;
    document.head.appendChild(style);
    $("lock-wrap").parentElement.style.display="none";
    document.querySelector(".page").style.display="none";
    const host = $("app-host");
    host.classList.add("show");
    host.innerHTML = `
      <div class="app-shell" style="max-width:1180px;margin:0 auto;padding:18px 16px 40px">
        <div class="topbar" style="position:sticky;top:12px;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="width:34px;height:34px;border-radius:9px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:13px">Q</div>
            <div>
              <div style="font-weight:750;letter-spacing:-0.02em;font-size:15px">quanta</div>
              <div style="font-size:11px;color:var(--muted);letter-spacing:0.02em">personal portfolio advisor</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <button id="btn-theme" class="btn small" style="width:auto;padding:6px 10px;border-radius:999px;font-size:11.5px" title="Toggle theme">Theme</button>
            <button id="btn-logout" class="btn small" style="width:auto;padding:6px 10px;border-radius:999px;font-size:11.5px">Log out</button>
          </div>
        </div>
        <div class="tabs" style="display:flex;gap:8px;margin:18px 0 14px;overflow:auto;padding-bottom:2px">
          <button data-tab="holdings" class="tab-btn active" style="display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--border);background:var(--text);color:var(--bg);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap">Holdings <span class="count" id="tab-count-hold" style="font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,0.15)">—</span></button>
          <button data-tab="recommendations" class="tab-btn" style="display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap">Recommendations <span class="count" id="tab-count-rec" style="font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,0.08)">—</span></button>
          <button data-tab="monitoring" class="tab-btn" style="display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap">Monitoring <span class="count" id="tab-count-mon" style="font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,0.08)">—</span></button>
        </div>
        <div id="stats-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px"></div>
        <div id="panel-holdings" class="tab-panel">
          <div class="toolbar" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px">
            <div class="search" style="position:relative;flex:1;min-width:220px">
              
              <input id="global-search" class="input" placeholder="Search holdings, funds, benchmark…" style="padding-left:34px" />
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button id="btn-add-stock" class="btn small primary" style="width:auto;padding:8px 12px;border-radius:999px;background:#3b82f6;color:#fff;font-size:12px">+ Add Stock</button>
              <button id="btn-add-fund" class="btn small" style="width:auto;padding:8px 12px;border-radius:999px">+ Add Fund</button>
              <button id="btn-export" class="btn small ghost" style="width:auto;padding:8px 12px;border-radius:999px">⬇ Export</button>
            </div>
          </div>
          <div class="card" style="background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden">
            <div class="card-header" style="padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)"><h2 style="margin:0;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);font-weight:800">Stocks — 14 positions</h2><span class="pill" id="stocks-count" style="font-size:11px;padding:4px 8px;border-radius:999px;border:1px solid var(--border)">—</span></div>
            <div class="table-wrap" style="overflow:auto;border:1px solid var(--border);border-radius:12px;margin:12px">
              <table style="width:100%;border-collapse:collapse;font-size:13px">
